# Continuous integration. Needs no secrets, so pull requests from forks run exactly the same
# checks. Every third-party action is pinned to a commit SHA (see docs/decisions/0009).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# No Prisma CLI usage ping from CI (see docs/decisions/0008).
env:
  CHECKPOINT_DISABLE: "1"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cardledger
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: cardledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cardledger -d cardledger"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Throwaway values for this job's own database; none of them is a secret.
      DATABASE_URL: postgresql://cardledger:ci-only-password@localhost:5432/cardledger
      BETTER_AUTH_URL: http://localhost:3100
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-0123456789
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate the Prisma client
        run: npx prisma generate
      - name: Lint and format (Biome)
        run: npm run check
      - name: Type check
        run: npm run typecheck
      - name: Tests (the suite creates and migrates its own _test database)
        run: npm test
      - name: Build
        run: npm run build
      - name: The auth secret must not be in the client bundle
        run: |
          if grep -rlF -- "$BETTER_AUTH_SECRET" .output/public; then
            echo "::error::BETTER_AUTH_SECRET leaked into the client bundle"
            exit 1
          fi

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit in the pull request must be signed off by its author
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: sh scripts/check-dco.sh "$BASE_SHA..$HEAD_SHA"

  docker:
    name: Docker smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image and check the stack
        run: sh scripts/docker-smoke.sh

  audit:
    name: npm audit (informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Reports known advisories in production dependencies without blocking a pull request.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high
