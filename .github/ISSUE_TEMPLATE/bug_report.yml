name: Bug report
description: Something does not work as documented
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Never paste real financial data.** That includes card numbers, account or statement details, amounts from your real ledger, database backups, `.env` files, session tokens and exports. Describe the problem with made-up values, or reproduce it with the synthetic demo account (`pnpm run db:seed`).

        **Security vulnerabilities do not belong here.** Report them privately: see [SECURITY.md](https://github.com/haruBlank0-0/card-ledger/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence of steps that triggers it. Use made-up data.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: how-run
    attributes:
      label: How are you running Card Ledger?
      options:
        - Docker Compose (docs/self-hosting.md)
        - Local development (pnpm run dev)
        - Something else
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: "Output of `git rev-parse --short HEAD` in your checkout."
      placeholder: "1a2b3c4"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: |
        For Docker Compose: `docker compose logs --tail=100 app`. The application's own log lines carry fixed messages and counts, not amounts or notes, but please check for email addresses, tokens and URLs before pasting.
      render: text
  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I removed real financial data, secrets and personal information from this report.
          required: true
        - label: I searched the existing issues for this problem.
          required: true
        - label: This is not a security vulnerability (those go through the private form in SECURITY.md).
          required: true
