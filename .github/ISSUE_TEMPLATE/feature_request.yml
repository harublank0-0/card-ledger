name: Feature request
description: Suggest an improvement or a new capability
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please check [docs/roadmap.md](https://github.com/haruBlank0-0/card-ledger/blob/main/docs/roadmap.md) first: some candidates are already listed there.

        **Do not paste real financial data**, backups, `.env` files or tokens. Use made-up examples.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation, not only the solution. Who needs this, and when?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: How you imagine it working, including any screens or settings.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: What do you do today, and what else did you consider?
  - type: checkboxes
    id: principles
    attributes:
      label: Fits the project's principles
      description: Card Ledger is self-hosted, private by default and minimal about sensitive data.
      options:
        - label: It needs no telemetry and no calls to external services (other than an operator-configured SMTP server).
          required: true
        - label: It does not need full card numbers, CVV, PIN or banking credentials.
          required: true
        - label: I removed real financial data and secrets from this request.
          required: true
