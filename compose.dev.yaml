# Development services only (database and mail catcher, for `npm run dev`).
# Self-hosting uses compose.yaml.
services:
  db:
    image: postgres:17-alpine
    container_name: card-ledger-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cardledger
      POSTGRES_PASSWORD: cardledger_dev
      POSTGRES_DB: cardledger
    ports:
      # Bound to localhost only; never publish Postgres on a public interface.
      - "127.0.0.1:5434:5432"
    volumes:
      - card_ledger_dev_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cardledger -d cardledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches outgoing email in development: SMTP on 1025, web inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: card-ledger-dev-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  card_ledger_dev_db:
